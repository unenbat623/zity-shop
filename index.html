<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta -->
    <title>Zity Shop — Хоол & Хүнсний Хүргэлт</title>
    <meta
      name="description"
      content="Zity Chef & Odoo ERP-тэй холбогдсон хүнсний хүргэлтийн платформ. Хоолны орц багц болон өдөр тутмын барааг 30 минутад."
    />
    <meta name="application-name" content="Zity Shop" />
    <!-- Theme color: JS нь theme store-оос харгалзан шинэчилнэ -->
    <meta name="theme-color" content="#F6F8FA" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zity Shop" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="shortcut icon" href="/favicon-32.png" />
    <link rel="mask-icon" href="/logo.svg" color="#10B981" />

    <!-- PWA Web Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zity Shop" />
    <meta property="og:locale" content="mn_MN" />
    <meta property="og:title" content="Zity Shop — Хоол & Хүнсний Хүргэлт" />
    <meta
      property="og:description"
      content="Zity Chef-ийн жорын орцыг болон өдөр тутмын хүнсийг 30 минутад авна уу."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zity Shop — Хоол & Хүнсний Хүргэлт" />
    <meta name="twitter:description" content="Zity Chef-ийн жорын орц болон өдөр тутмын хүнс, 30 минутад." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
